[package]
name = "mikke"
version = "0.3.0"
edition = "2021"
description = "Markdown ノート検索 CLI — SQLite FTS5 (trigram, 日本語対応) BM25 + optional ローカル embedding hybrid"
license = "MIT"
repository = "https://github.com/kimushun1101/mikke"
readme = "README.md"
keywords = ["search", "markdown", "notes", "cli", "japanese"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "mikke"
path = "src/main.rs"

[features]
default = []
# semantic 検索 (embedding)。既定 OFF で BM25 のみの軽量ビルド。
semantic = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# --json (JSON Lines) 出力用。エスケープの手書きは安定インターフェースには危険なため serde 経由で固定
# (semantic feature の metadata.json でも使用)。実行時初期化は無く即起動方針と衝突しない。
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
regex = "1"

# --- semantic feature 専用 (既定ビルドには入らない) ---
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
# default features から esaxx_fast (C++ suffix array, Unigram 訓練専用で mikke は未使用) と
# progressbar (訓練進捗表示) を外す。onig は維持 (regex エンジンを既定と同一に保つ)。
# これで C++ 依存が消え、musl static ビルドが musl-gcc (musl-tools) のみで通る。
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }
# default (native-tls) は openssl-dev 必須のため、rustls ベースの ureq 経路のみ有効化
# (safetensors の読み書きは candle-core 経由 = candle_core::safetensors)
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["ureq"] }

# パイプ早期終了 (`| head` 等) で panic しないよう、Rust 既定の SIGPIPE 無視を解除するためだけに使う
# (docs/SPEC.md「exit code」)。SIGPIPE を持たない Windows のビルドには入れない。
# pure Rust で C ツールチェーンを要求しないため musl static ビルドも壊さない。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
