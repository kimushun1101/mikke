name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy (default = BM25)
        run: cargo clippy --locked -- -D warnings
      - name: test (default = BM25)
        run: cargo test --locked
      - name: clippy (semantic feature)
        run: cargo clippy --locked --features semantic -- -D warnings
      # モデル取得が必要な e2e は #[ignore] で CI から除外 (ローカルで -- --ignored)
      - name: test (semantic feature)
        run: cargo test --locked --features semantic
      # release の musl 静的ビルドがタグ作成時まで壊れに気づけないのを防ぐ
      # (check はリンクを走らせないため、dev プロファイルの build でリンク段階まで検証)
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build (semantic, musl)
        run: cargo build --locked --features semantic --target x86_64-unknown-linux-musl

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh
      - name: dash syntax
        run: dash -n install.sh
      - name: pwsh syntax
        run: |
          pwsh -NoProfile -Command '
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'

  # 実 Releases に対する smoke。Linux は latest 解決込み、Windows は既存タグ固定
  # (api.github.com の共有 runner での rate limit を避けるため)
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run install.sh
        run: sh install.sh --to "$RUNNER_TEMP/bin"
      # HOME 未設定 (cron / systemd / コンテナ) でも --to だけで入ること
      - name: run install.sh (slim, HOME 未設定)
        run: env -u HOME sh install.sh --slim --to "$RUNNER_TEMP/bin-slim"
      # 配置先に mikke という名のディレクトリがある場合、成功行を出さずに失敗すること
      - name: run install.sh (同名ディレクトリとの衝突)
        run: |
          mkdir -p "$RUNNER_TEMP/bin-conflict/mikke"
          if sh install.sh --slim --to "$RUNNER_TEMP/bin-conflict" >"$RUNNER_TEMP/conflict.log" 2>&1; then
            cat "$RUNNER_TEMP/conflict.log"
            echo "失敗するべきところで成功した" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/conflict.log"
          if grep -q '^installed:' "$RUNNER_TEMP/conflict.log"; then
            echo "失敗したのに installed: を出している" >&2
            exit 1
          fi
          [ ! -e "$RUNNER_TEMP/bin-conflict/mikke/mikke" ]

  install-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: run install.ps1
        shell: pwsh
        run: |
          $env:MIKKE_VERSION = "v0.3.0"
          $env:MIKKE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "bin"
          ./install.ps1
