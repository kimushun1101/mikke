name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy (default = BM25)
        run: cargo clippy --locked -- -D warnings
      - name: test (default = BM25)
        run: cargo test --locked
      - name: clippy (semantic feature)
        run: cargo clippy --locked --features semantic -- -D warnings
      # モデル取得が必要な e2e は #[ignore] で CI から除外 (ローカルで -- --ignored)
      - name: test (semantic feature)
        run: cargo test --locked --features semantic
      # release の musl 静的ビルドがタグ作成時まで壊れに気づけないのを防ぐ
      # (check はリンクを走らせないため、dev プロファイルの build でリンク段階まで検証)
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build (semantic, musl)
        run: cargo build --locked --features semantic --target x86_64-unknown-linux-musl

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh
      - name: dash syntax
        run: dash -n install.sh
      - name: pwsh syntax
        run: |
          pwsh -NoProfile -Command '
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'
      # #44: BOM 付きだと irm | iex で先頭トークンに U+FEFF が結合して CommandNotFound になり、
      # BOM 無しで非 ASCII があると Windows PowerShell 5.1 のファイル実行 (ANSI/cp932 読み) で
      # 後続の引用符・改行が食われて parse error になる。両方を避けるため ASCII のみを強制する
      - name: install.ps1 is ASCII without BOM
        run: |
          # C locale では [:print:] = 0x20-0x7E なので、BOM を含む非 ASCII バイトが全て引っかかる
          if LC_ALL=C grep -n '[^[:print:][:space:]]' install.ps1; then
            echo "install.ps1 must be ASCII-only without a BOM (see #44)" >&2
            exit 1
          fi

  # install.ps1 の Windows PowerShell 5.1 (issue #44 の再現環境) での検査。
  # 前半 3 step はネットワークを使わない (MIKKE_VERSION を不正にして最初の検査で throw させる)。
  # 後半はタグ固定 (MIKKE_VERSION) の実ダウンロード smoke (#46)。latest 解決 (api.github.com) は
  # 共有 runner での rate limit を避けるため使わない
  install-script-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      SMOKE_VERSION: v0.3.1
    steps:
      - uses: actions/checkout@v7
      # irm | iex 相当: ダウンロード内容は BOM を含んだ文字列のまま iex に渡る (ファイル実行と違い
      # BOM が自動除去されない)。#44 はこの経路でのみ再現する
      - name: irm | iex path
        run: |
          $env:MIKKE_VERSION = "not-a-version"
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("$PWD/install.ps1"))
          try { $text | Invoke-Expression; throw "install.ps1 did not reject MIKKE_VERSION" }
          catch { if ($_.Exception.Message -notmatch "^MIKKE_VERSION") { throw } }
      - name: file path
        run: |
          $env:MIKKE_VERSION = "not-a-version"
          try { & "$PWD/install.ps1"; throw "install.ps1 did not reject MIKKE_VERSION" }
          catch { if ($_.Exception.Message -notmatch "^MIKKE_VERSION") { throw } }
      # BOM 無しの install.ps1 を日本語 Windows の PowerShell 5.1 がファイル実行すると cp932 で読む。
      # その読み方でも parse error にならないこと (非 ASCII が混入すると壊れる)
      - name: parse as cp932
        run: |
          $text = [System.Text.Encoding]::GetEncoding(932).GetString([System.IO.File]::ReadAllBytes("$PWD/install.ps1"))
          $t = $null; $e = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$t, [ref]$e) | Out-Null
          if ($e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
      # (a) 既定配置先 $env:USERPROFILE\.local\bin に入り、ユーザー PATH (レジストリ HKCU) に自動追加され、
      # 現セッションの $env:Path にも足されて "active:" 行と Get-Command mikke がそこを指すこと。
      # step ごとにシェルが新規なので $env:Path の追加は step を跨がないが、レジストリの変更は後続 step に残る
      - name: install to the default dir (adds it to the user PATH)
        run: |
          $env:MIKKE_VERSION = $env:SMOKE_VERSION
          $expectedDir = Join-Path $env:USERPROFILE ".local\bin"
          $expectedExe = Join-Path $expectedDir "mikke.exe"
          # runner image が既に ~\.local\bin をユーザー PATH や初期 $env:Path に載せていても「追加」分岐を
          # 検証できるよう、使い捨て runner のユーザー PATH と現セッションの $env:Path から該当エントリを外しておく
          $userPath = ([Environment]::GetEnvironmentVariable("Path", "User") -split ";") | Where-Object { $_ -and $_ -ne $expectedDir }
          [Environment]::SetEnvironmentVariable("Path", ($userPath -join ";"), "User")
          $env:Path = (($env:Path -split ";") | Where-Object { $_ -and $_ -ne $expectedDir }) -join ";"
          $log = & "$PWD/install.ps1" *>&1 | ForEach-Object { "$_" }
          $log
          if (-not ($log -match "^installed: ")) { throw "no installed: line" }
          if (-not (Test-Path $expectedExe -PathType Leaf)) { throw "mikke.exe is not at the default location $expectedExe" }
          if (-not ($log -match "^note: added ")) { throw "no note about adding the install dir to the user PATH" }
          if (-not (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $expectedDir)) {
            throw "$expectedDir was not added to the user PATH (registry)"
          }
          if (-not (($env:Path -split ";") -contains $expectedDir)) { throw "$expectedDir was not added to this session's PATH" }
          if ($log -match "another mikke") { throw "unexpected shadowing warning" }
          if (-not ($log -contains "active: $expectedExe")) { throw "no active: line pointing at $expectedExe" }
          $resolved = (Get-Command mikke -CommandType Application).Source
          if ($resolved -ne $expectedExe) { throw "Get-Command mikke resolved to $resolved, expected $expectedExe" }
          # 配列に受ける (| Select-Object -First 1 でパイプラインを早期停止すると native の $LASTEXITCODE が -1 になる競合がある)
          $version = @(& mikke --version)[0]
          if ($version -notmatch "^mikke 0\.3\.1\b") { throw "unexpected version output: $version" }
      # (b) MIKKE_NO_MODIFY_PATH ではユーザー PATH (レジストリ) を変えず、手動追加の案内を出すこと
      - name: install with MIKKE_NO_MODIFY_PATH (leaves the user PATH alone)
        run: |
          $env:MIKKE_VERSION = $env:SMOKE_VERSION
          $env:MIKKE_NO_MODIFY_PATH = "1"
          $env:MIKKE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "mikke-optout"
          $before = [Environment]::GetEnvironmentVariable("Path", "User")
          $sessionBefore = $env:Path
          $log = & "$PWD/install.ps1" *>&1 | ForEach-Object { "$_" }
          $log
          if (-not ($log -match "^installed: ")) { throw "no installed: line" }
          if (-not (Test-Path (Join-Path $env:MIKKE_INSTALL_DIR "mikke.exe") -PathType Leaf)) { throw "mikke.exe is not in MIKKE_INSTALL_DIR" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -cne $before) { throw "user PATH changed despite MIKKE_NO_MODIFY_PATH" }
          if ($env:Path -cne $sessionBefore) { throw "session PATH changed despite MIKKE_NO_MODIFY_PATH" }
          if (-not ($log -match "^note: .*MIKKE_NO_MODIFY_PATH")) { throw "no opt-out note" }
          if (-not ($log -match "SetEnvironmentVariable")) { throw "no hint on how to add the dir to PATH manually" }
      # (c) PATH 上に別の mikke ((a) で入れた既定配置先) が先にある状態で別 dir へ入れると、"active:" 行が
      # その exe を指し、解決先とその --version、所有元別の案内 (cargo でも旧既定でもないので汎用) を含む
      # 警告が出ること。上書きや PATH の並べ替えは自動でしない (MIKKE_INSTALL_DIR での上書き案内も出さない)
      - name: install to another dir while a different mikke is first on PATH (warns)
        run: |
          $env:MIKKE_VERSION = $env:SMOKE_VERSION
          $firstDir = Join-Path $env:USERPROFILE ".local\bin"
          $firstExe = Join-Path $firstDir "mikke.exe"
          $env:Path = "$firstDir;$env:Path"
          $env:MIKKE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "mikke-shadowed"
          $log = & "$PWD/install.ps1" *>&1 | ForEach-Object { "$_" }
          $log
          if (-not ($log -match "^installed: ")) { throw "no installed: line" }
          if (-not ($log -contains "active: $firstExe")) { throw "no active: line pointing at $firstExe" }
          $warn = @($log -match "another mikke is found first on PATH")
          if ($warn.Count -eq 0) { throw "no shadowing warning" }
          if (-not ($warn -match [regex]::Escape($firstExe))) { throw "warning does not name the resolved path $firstExe" }
          if (-not ($warn -match "mikke 0\.3\.1")) { throw "warning does not show the resolved binary's --version" }
          if (-not ($log -match "whatever installed it")) { throw "no owner-based advice for a mikke of unknown origin" }
          if ($log -match "MIKKE_INSTALL_DIR=") { throw "must not suggest overwriting the other mikke with MIKKE_INSTALL_DIR" }
      # (d) 判定はディレクトリでなくファイル単位: PATH 先頭の mikke.ps1 (ExternalScript) と、配置先 dir 内で
      # PATHEXT 順により .exe に勝つ mikke.com を、それぞれ警告が名指しすること
      - name: warn about mikke.ps1 on PATH and mikke.com in the install dir (per-file check)
        run: |
          $env:MIKKE_VERSION = $env:SMOKE_VERSION
          $env:MIKKE_NO_MODIFY_PATH = "1"
          $origPath = $env:Path
          $realExe = Join-Path $env:USERPROFILE ".local\bin\mikke.exe"
          # mikke.ps1 が PATH 先頭の dir にある
          $ps1Dir = Join-Path $env:RUNNER_TEMP "shadow-ps1"
          New-Item -ItemType Directory -Force $ps1Dir | Out-Null
          Set-Content -Path (Join-Path $ps1Dir "mikke.ps1") -Value 'Write-Output "mikke 0.0.0 (fake ps1)"' -Encoding Ascii
          $env:Path = "$ps1Dir;$origPath"
          $env:MIKKE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "mikke-vs-ps1"
          $log = & "$PWD/install.ps1" *>&1 | ForEach-Object { "$_" }
          $log
          if (-not ($log -match "^installed: ")) { throw "no installed: line" }
          $ps1 = Join-Path $ps1Dir "mikke.ps1"
          if (-not ($log -contains "active: $ps1")) { throw "no active: line pointing at $ps1" }
          $warn = @($log -match "another mikke is found first on PATH")
          if (-not ($warn -match [regex]::Escape($ps1))) { throw "warning does not name $ps1" }
          if (-not ($warn -match "fake ps1")) { throw "warning does not show the script's --version output" }
          # mikke.com が配置先 dir にある (MZ 形式の exe は .com 名でも起動する)
          $comDir = Join-Path $env:RUNNER_TEMP "mikke-vs-com"
          New-Item -ItemType Directory -Force $comDir | Out-Null
          $com = Join-Path $comDir "mikke.com"
          Copy-Item $realExe $com -Force
          $env:Path = "$comDir;$origPath"
          $env:MIKKE_INSTALL_DIR = $comDir
          $log = & "$PWD/install.ps1" *>&1 | ForEach-Object { "$_" }
          $log
          if (-not ($log -match "^installed: ")) { throw "no installed: line" }
          if (-not (Test-Path (Join-Path $comDir "mikke.exe") -PathType Leaf)) { throw "mikke.exe is not in $comDir" }
          if (-not ($log -contains "active: $com")) { throw "no active: line pointing at $com" }
          $warn = @($log -match "another mikke is found first on PATH")
          if (-not ($warn -match [regex]::Escape($com))) { throw "warning does not name $com (same-dir shadow missed)" }
          if (-not ($log -match "PATHEXT")) { throw "no advice about the same-dir mikke.com" }
      # (e) 所有元別の案内: $env:CARGO_HOME\bin の mikke は cargo 管理として "cargo uninstall mikke" を含む案内、
      # 旧既定 %LOCALAPPDATA%\Programs\mikke の mikke は残骸として削除案内 (別の leftover note とは重複しない)
      - name: owner-specific advice for a cargo-managed or old-default mikke on PATH
        run: |
          $env:MIKKE_VERSION = $env:SMOKE_VERSION
          $env:MIKKE_NO_MODIFY_PATH = "1"
          $origPath = $env:Path
          $realExe = Join-Path $env:USERPROFILE ".local\bin\mikke.exe"
          # cargo 管理 (CARGO_HOME を使い捨ての dir に向ける)
          $env:CARGO_HOME = Join-Path $env:RUNNER_TEMP "fake-cargo"
          $cargoBin = Join-Path $env:CARGO_HOME "bin"
          New-Item -ItemType Directory -Force $cargoBin | Out-Null
          Copy-Item $realExe (Join-Path $cargoBin "mikke.exe") -Force
          $env:Path = "$cargoBin;$origPath"
          $env:MIKKE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "mikke-vs-cargo"
          $log = & "$PWD/install.ps1" *>&1 | ForEach-Object { "$_" }
          $log
          if (-not ($log -match "^installed: ")) { throw "no installed: line" }
          if (-not ($log -match "another mikke is found first on PATH")) { throw "no shadowing warning" }
          if (-not ($log -match "cargo uninstall mikke")) { throw "no cargo-specific advice" }
          # 旧既定の配置先
          $oldDir = Join-Path $env:LOCALAPPDATA "Programs\mikke"
          New-Item -ItemType Directory -Force $oldDir | Out-Null
          Copy-Item $realExe (Join-Path $oldDir "mikke.exe") -Force
          $env:Path = "$oldDir;$origPath"
          $env:MIKKE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "mikke-vs-old"
          $log = & "$PWD/install.ps1" *>&1 | ForEach-Object { "$_" }
          $log
          if (-not ($log -match "^installed: ")) { throw "no installed: line" }
          if (-not ($log -match "another mikke is found first on PATH")) { throw "no shadowing warning" }
          if (-not ($log -match "leftover of the old default location: delete ")) { throw "no old-default-specific advice" }
          if ($log -match "^note: .*leftover") { throw "leftover note duplicated the shadow warning" }

  # 実 Releases に対する smoke (latest 解決込み)。latest 解決 (api.github.com) を伴う smoke は Linux のみ
  # (共有 runner での rate limit を避ける)。Windows はタグ固定の smoke を install-script-windows に置く
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run install.sh
        run: |
          SHELL=/bin/zsh sh install.sh --to "$RUNNER_TEMP/bin" >"$RUNNER_TEMP/plain.log" 2>&1 && rc=0 || rc=$?
          cat "$RUNNER_TEMP/plain.log"
          [ "$rc" -eq 0 ]
          grep -q '^installed:' "$RUNNER_TEMP/plain.log"
          # 配置先が PATH に無ければ、$SHELL 別の追記先 (zsh → ~/.zshrc) と追記する 1 行、フルパスでの起動を案内すること
          grep -qF "$HOME/.zshrc に次の 1 行" "$RUNNER_TEMP/plain.log"
          grep -qF '  export PATH="' "$RUNNER_TEMP/plain.log"
          grep -qF "フルパスで: $RUNNER_TEMP/bin/mikke" "$RUNNER_TEMP/plain.log"
      # HOME 未設定 (cron / systemd / コンテナ) でも --to だけで入ること
      - name: run install.sh (slim, HOME 未設定)
        run: env -u HOME sh install.sh --slim --to "$RUNNER_TEMP/bin-slim"
      # 配置先に mikke という名のディレクトリがある場合、成功行を出さずに失敗すること
      - name: run install.sh (同名ディレクトリとの衝突)
        run: |
          mkdir -p "$RUNNER_TEMP/bin-conflict/mikke"
          if sh install.sh --slim --to "$RUNNER_TEMP/bin-conflict" >"$RUNNER_TEMP/conflict.log" 2>&1; then
            cat "$RUNNER_TEMP/conflict.log"
            echo "失敗するべきところで成功した" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/conflict.log"
          if grep -q '^installed:' "$RUNNER_TEMP/conflict.log"; then
            echo "失敗したのに installed: を出している" >&2
            exit 1
          fi
          [ ! -e "$RUNNER_TEMP/bin-conflict/mikke/mikke" ]
          # ダウンロード前に弾くこと (無駄な取得をしない)
          if grep -q '^download:' "$RUNNER_TEMP/conflict.log"; then
            echo "衝突を検知する前にダウンロードしている" >&2
            exit 1
          fi
      # 配置先の空文字指定を既定へ落とさず error にすること
      - name: run install.sh (配置先が空文字)
        run: |
          for label in '--to' 'MIKKE_INSTALL_DIR'; do
            if [ "$label" = '--to' ]; then
              sh install.sh --slim --to "" >"$RUNNER_TEMP/empty.log" 2>&1 && rc=0 || rc=$?
            else
              MIKKE_INSTALL_DIR="" sh install.sh --slim >"$RUNNER_TEMP/empty.log" 2>&1 && rc=0 || rc=$?
            fi
            cat "$RUNNER_TEMP/empty.log"
            if [ "$rc" -eq 0 ]; then
              echo "$label='' で失敗するべきところで成功した" >&2
              exit 1
            fi
            if ! grep -q '配置先が空文字' "$RUNNER_TEMP/empty.log"; then
              echo "$label='' が空文字として報告されていない" >&2
              exit 1
            fi
            if [ -e "$HOME/.local/bin/mikke" ]; then
              echo "$label='' なのに既定の配置先へ入れている" >&2
              exit 1
            fi
          done
      # PATH 上に別の mikke が先にある状態で --to 別 dir へ入れると、実際に起動する方を active: で示し、
      # 取り違えを警告すること。上書き (MIKKE_INSTALL_DIR) は案内せず、PATH も自動では書き換えない (所有元に応じた
      # 対処と PATH 順序の見直しを案内するだけ)。照合は pwd -P の物理パス (install.sh の出力に合わせる)
      - name: run install.sh (PATH 上の別 mikke を警告)
        run: |
          real_tmp=$(cd "$RUNNER_TEMP" && pwd -P)
          mkdir -p "$RUNNER_TEMP/shadow-bin"
          cat > "$RUNNER_TEMP/shadow-bin/mikke" <<'EOF'
          #!/bin/sh
          printf 'mikke 0.0.0 (fake)\n'
          EOF
          chmod +x "$RUNNER_TEMP/shadow-bin/mikke"
          PATH="$RUNNER_TEMP/shadow-bin:$PATH" sh install.sh --slim --to "$RUNNER_TEMP/bin-shadow" >"$RUNNER_TEMP/shadow.log" 2>&1 && rc=0 || rc=$?
          cat "$RUNNER_TEMP/shadow.log"
          if [ "$rc" -ne 0 ]; then
            echo "別 mikke が PATH にあるだけで失敗した (exit $rc)" >&2
            exit 1
          fi
          grep -q '^installed:' "$RUNNER_TEMP/shadow.log"
          grep -qF "active: $real_tmp/shadow-bin/mikke" "$RUNNER_TEMP/shadow.log"
          if ! grep -q '先に見つかる' "$RUNNER_TEMP/shadow.log"; then
            echo "PATH 上の別 mikke を警告していない" >&2
            exit 1
          fi
          # 解決先のパス・その --version 1 行目・所有元 (汎用) の案内が含まれ、上書き案内は出さないこと
          grep -qF "warning: PATH 上では $real_tmp/shadow-bin/mikke (mikke 0.0.0 (fake)) が先に見つかるため" "$RUNNER_TEMP/shadow.log"
          grep -qF 'PATH の順序を見直す' "$RUNNER_TEMP/shadow.log"
          if grep -q 'MIKKE_INSTALL_DIR=' "$RUNNER_TEMP/shadow.log"; then
            echo "別 mikke を MIKKE_INSTALL_DIR で上書きする案内を出している" >&2
            exit 1
          fi
          # 配置先の本物は入っていること
          "$RUNNER_TEMP/bin-shadow/mikke" --version
      # PATH に相対要素がある (WSL 等) と command -v は "shadow-bin/mikke" のような相対パスを返す。
      # それも取りこぼさず、active: と警告は cwd 基準の絶対パスで出すこと
      - name: run install.sh (相対 PATH 要素の別 mikke を絶対パスで警告)
        run: |
          real_tmp=$(cd "$RUNNER_TEMP" && pwd -P)
          cd "$RUNNER_TEMP"
          PATH="shadow-bin:$PATH" sh "$GITHUB_WORKSPACE/install.sh" --slim --to "$RUNNER_TEMP/bin-shadow-rel" >"$RUNNER_TEMP/shadow-rel.log" 2>&1 && rc=0 || rc=$?
          cat "$RUNNER_TEMP/shadow-rel.log"
          [ "$rc" -eq 0 ]
          grep -qF "active: $real_tmp/shadow-bin/mikke" "$RUNNER_TEMP/shadow-rel.log"
          grep -qF "warning: PATH 上では $real_tmp/shadow-bin/mikke (mikke 0.0.0 (fake)) が先に見つかるため" "$RUNNER_TEMP/shadow-rel.log"
          if grep -q 'PATH 上では shadow-bin/mikke' "$RUNNER_TEMP/shadow-rel.log"; then
            echo "警告が相対パスのまま" >&2
            exit 1
          fi
      # 配置先を指す symlink が PATH 上で先に見つかる場合は同じ実体なので、警告も PATH の案内も出さず active: だけ出すこと
      - name: run install.sh (配置先への symlink は警告しない)
        run: |
          real_tmp=$(cd "$RUNNER_TEMP" && pwd -P)
          mkdir -p "$RUNNER_TEMP/link-bin" "$RUNNER_TEMP/bin-target"
          ln -s "$RUNNER_TEMP/bin-target/mikke" "$RUNNER_TEMP/link-bin/mikke"
          PATH="$RUNNER_TEMP/link-bin:$PATH" sh install.sh --slim --to "$RUNNER_TEMP/bin-target" >"$RUNNER_TEMP/symlink.log" 2>&1 && rc=0 || rc=$?
          cat "$RUNNER_TEMP/symlink.log"
          [ "$rc" -eq 0 ]
          grep -qF "active: $real_tmp/link-bin/mikke" "$RUNNER_TEMP/symlink.log"
          if grep -q '先に見つかる' "$RUNNER_TEMP/symlink.log"; then
            echo "同じ実体への symlink を別物として警告している" >&2
            exit 1
          fi
          if grep -q '^note:' "$RUNNER_TEMP/symlink.log"; then
            echo "symlink 経由で既に起動できるのに PATH の追加を案内している" >&2
            exit 1
          fi
      # ~/.cargo/bin の mikke (cargo install 版) が先に見つかる場合は、上書きせず cargo 側での更新・削除を案内すること
      - name: run install.sh (cargo install 版が先に見つかる場合の案内)
        run: |
          real_home=$(cd "$HOME" && pwd -P)
          mkdir -p "$HOME/.cargo/bin"
          if [ -e "$HOME/.cargo/bin/mikke" ]; then
            echo "runner に $HOME/.cargo/bin/mikke が既にある" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/shadow-bin/mikke" "$HOME/.cargo/bin/mikke"
          PATH="$HOME/.cargo/bin:$PATH" sh install.sh --slim --to "$RUNNER_TEMP/bin-cargo" >"$RUNNER_TEMP/cargo.log" 2>&1 && rc=0 || rc=$?
          rm -f "$HOME/.cargo/bin/mikke"
          cat "$RUNNER_TEMP/cargo.log"
          [ "$rc" -eq 0 ]
          grep -qF "active: $real_home/.cargo/bin/mikke" "$RUNNER_TEMP/cargo.log"
          grep -q 'cargo uninstall mikke' "$RUNNER_TEMP/cargo.log"
          if grep -q 'PATH の順序を見直す' "$RUNNER_TEMP/cargo.log"; then
            echo "cargo 版なのに汎用の案内を出している" >&2
            exit 1
          fi
